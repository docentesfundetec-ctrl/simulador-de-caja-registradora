<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Turno Farmacéutico - Royal 410DX</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel (Classic Runtime) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9; 
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }

        body {
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
            overflow: hidden;
            background-color: #0f172a;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        Babel.registerPreset('react-classic', {
            presets: [[Babel.availablePresets['react'], { runtime: 'classic' }]]
        });
    </script>

    <script type="text/babel" data-presets="react-classic">
        const { useState, useEffect, useRef } = React;

        const formatCurrency = (value) => {
          return new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', minimumFractionDigits: 0 }).format(value);
        };

        function App() {
          // --- STATE MANAGEMENT ---
          const [gameMode, setGameMode] = useState('menu'); 
          
          const [display, setDisplay] = useState('0');
          const [total, setTotal] = useState(0);
          const [receipt, setReceipt] = useState([]);
          const [multiplier, setMultiplier] = useState(1);
          const [lastEntry, setLastEntry] = useState(null);
          const [drawerOpen, setDrawerOpen] = useState(false);
          const [errorState, setErrorState] = useState(false);
          const [statusIndicator, setStatusIndicator] = useState(''); 
          
          const [registerMode, setRegisterMode] = useState('reg1'); 
          const [drawerCash, setDrawerCash] = useState(0); 
          
          const [currentLevel, setCurrentLevel] = useState(0);
          const [lastCompletedTx, setLastCompletedTx] = useState(null); 
          const [evaluation, setEvaluation] = useState({ status: 'none', message: '', isFinal: false }); 
          
          const [faqOpen, setFaqOpen] = useState(false);
          const [showManual, setShowManual] = useState(false); // Mobile Menu State
          const [scale, setScale] = useState(1); // Responsive Scale State

          const receiptEndRef = useRef(null);
          const registerContainerRef = useRef(null);

          // Auto-scroll receipt
          useEffect(() => {
            receiptEndRef.current?.scrollIntoView({ behavior: 'smooth' });
          }, [receipt]);

          // Responsive Scaling Logic
          useEffect(() => {
              const handleResize = () => {
                  if (registerContainerRef.current) {
                      const availableWidth = registerContainerRef.current.clientWidth;
                      const targetWidth = 730; // 700px register + 30px padding
                      if (availableWidth < targetWidth) {
                          setScale(availableWidth / targetWidth);
                      } else {
                          setScale(1);
                      }
                  }
              };

              setTimeout(handleResize, 50); // initial calculation
              window.addEventListener('resize', handleResize);
              return () => window.removeEventListener('resize', handleResize);
          }, [gameMode]);

          // --- ACTIONS & SOUNDS ---
          const triggerError = () => {
            setErrorState(true);
            setStatusIndicator('ERROR');
          };

          const isSalesMode = registerMode === 'reg1' || registerMode === 'reg2';

          const handleNumber = (num) => {
            if (registerMode === 'off') return;
            if (!isSalesMode || errorState || evaluation.status !== 'none') return;
            if (drawerOpen) setDrawerOpen(false); 
            setStatusIndicator('');
            
            setDisplay(prev => {
              if (prev === '0') return num;
              if (prev.length > 7) return prev; 
              return prev + num;
            });
          };

          const handleClear = () => {
            if (registerMode === 'off') return;
            if (evaluation.status !== 'none') return;
            setDisplay('0');
            setErrorState(false);
            setStatusIndicator('');
            setMultiplier(1);
          };

          const handleDept = (deptNum, deptName) => {
            if (registerMode === 'off') return;
            if (!isSalesMode || errorState || evaluation.status !== 'none') return;
            const amount = parseInt(display) || 0;
            
            if (amount === 0) {
              triggerError(); return;
            }

            const itemTotal = amount * multiplier;
            setTotal(prev => prev + itemTotal);
            
            const newLines = [];
            if (multiplier > 1) {
              newLines.push({ text: `${multiplier} X @ ${formatCurrency(amount)}`, type: 'info' });
            }
            newLines.push({ label: `DEP${deptNum} ${deptName.substring(0,6)}`, value: formatCurrency(itemTotal), type: 'item' });
            
            setReceipt(prev => [...prev, ...newLines]);
            setLastEntry({ amount: itemTotal, dept: deptNum, linesAdded: newLines.length });
            
            setDisplay('0');
            setMultiplier(1);
            setStatusIndicator('');
          };

          const handleVoid = () => {
            if (registerMode === 'off') return;
            if (!isSalesMode || errorState || evaluation.status !== 'none') return;
            if (!lastEntry) { triggerError(); return; }

            setTotal(prev => prev - lastEntry.amount);
            setReceipt(prev => [
              ...prev,
              { label: `ANULAR DEP${lastEntry.dept}`, value: `-${formatCurrency(lastEntry.amount)}`, type: 'void' }
            ]);
            
            setLastEntry(null);
            setDisplay('0');
          };

          const handleSubtotalNS = () => {
            if (registerMode === 'off') return;
            if (!isSalesMode || errorState || evaluation.status !== 'none') return;
            
            if (total === 0 && display === '0') {
                setDrawerOpen(true);
                setReceipt(prev => [...prev, { text: 'NO VENTA', type: 'info' }]);
                setStatusIndicator('CAJON ABIERTO');
                return;
            }

            setDisplay(total.toString());
            setStatusIndicator('SUBTOTAL');
          };

          const handleCash = () => {
            if (registerMode === 'off') return;
            if (errorState || evaluation.status !== 'none') return;

            if (registerMode === 'x' || registerMode === 'z') {
               setReceipt(prev => [
                   ...prev,
                   { text: `--- REPORTE ${registerMode.toUpperCase()} ---`, type: 'info' },
                   { label: 'EFECTIVO EN CAJA', value: formatCurrency(drawerCash), type: 'item' },
                   { text: '----------------------', type: 'info' }
               ]);
               setDrawerOpen(true);
               setStatusIndicator(`REP. ${registerMode.toUpperCase()} OK`);
               setLastCompletedTx({ type: 'report', mode: registerMode, amount: drawerCash });
               
               if (registerMode === 'z') { setDrawerCash(0); }
               return;
            }

            if (!isSalesMode) return;
            if (total === 0) return;

            let tendered = parseInt(display) || 0;
            if (tendered === 0) { tendered = total; }
            if (tendered < total) { triggerError(); return; }

            const change = tendered - total;
            setReceipt(prev => [
              ...prev,
              { label: 'TOTAL', value: formatCurrency(total), type: 'total' },
              { label: 'EFECTIVO', value: formatCurrency(tendered), type: 'tender' },
              { label: 'CAMBIO', value: formatCurrency(change), type: 'change' },
              { text: '----------------------', type: 'info' }
            ]);

            setDrawerCash(prev => prev + total);
            setLastCompletedTx({ type: 'sale', total, tendered, change });
            setDisplay(change.toString());
            setStatusIndicator('CAMBIO');
            setTotal(0);
            setLastEntry(null);
            setDrawerOpen(true);
          };

          const handleQtyTime = () => {
            if (registerMode === 'off') return;
            if (!isSalesMode || errorState || evaluation.status !== 'none') return;
            const qty = parseInt(display);
            if (qty > 0) {
              setMultiplier(qty);
              setDisplay('0');
              setStatusIndicator(`CANT: ${qty}`);
            } else {
              triggerError();
            }
          };

          const handlePaidOut = () => {
              if (registerMode === 'off') return;
              if (!isSalesMode || errorState || evaluation.status !== 'none') return;
              const amount = parseInt(display) || 0;
              if (amount > 0) {
                  setReceipt(prev => [...prev, { label: 'SALIDA (PO)', value: `-${formatCurrency(amount)}`, type: 'void' }]);
                  setDrawerCash(prev => prev - amount);
                  setLastCompletedTx({ type: 'po', amount });
                  setDisplay('0');
                  setDrawerOpen(true);
                  setStatusIndicator('SALIDA PO');
              } else { triggerError(); }
          };

          const handleReceivedOnAccount = () => {
              if (registerMode === 'off') return;
              if (!isSalesMode || errorState || evaluation.status !== 'none') return;
              const amount = parseInt(display) || 0;
              if (amount > 0) {
                  setReceipt(prev => [...prev, { label: 'ENTRADA (RA)', value: formatCurrency(amount), type: 'item' }]);
                  setDrawerCash(prev => prev + amount); 
                  setLastCompletedTx({ type: 'ra', amount });
                  setDisplay('0');
                  setDrawerOpen(true);
                  setStatusIndicator('ENTRADA RA');
              } else { triggerError(); }
          };

          // --- LEVELS & TIMELINE ---
          const shiftTimes = [
            "08:00 AM", "08:45 AM", "09:30 AM", "10:15 AM",
            "11:00 AM", "11:45 AM", "12:30 PM", "01:15 PM",
            "02:00 PM", "02:45 PM", "03:30 PM", "04:00 PM"
          ];

          const guidedLevels = [
            { id: 0, type: 'ra', character: { name: 'Gerente', icon: 'ph-user-gear', color: 'text-slate-700', role: 'Apertura' }, dialogue: "Buenos días. Aquí tienes el dinero de base para arrancar el turno. Regístralo para cuadrar. Son $100.000.", mockItems: [], mockMoney: 100000, expected: { amount: 100000 }, hint: "Asegura la llave en REG1. Digita 100000 y presiona la tecla verde [chk/RA] para ingresar el fondo de caja." },
            { id: 1, type: 'sale', character: { name: 'Cliente Joven', icon: 'ph-user', color: 'text-blue-600', role: 'Cliente' }, dialogue: "¡Hola! Necesito un Acetaminofén por favor. Aquí tienes un billete de $10.000.", mockItems: [{ icon: 'ph-pill', color: 'blue', name: 'Acetaminofén', price: 3500 }], mockMoney: 10000, expected: { total: 3500, tendered: 10000 }, hint: "Digita 3500. Presiona [2/10] (OTC). Presiona [#/ST/NS]. Digita 10000 y presiona [TOTAL]." },
            { id: 2, type: 'sale', character: { name: 'Enfermera', icon: 'ph-user', color: 'text-green-600', role: 'Cliente' }, dialogue: "Buenas tardes. Necesito llevarme 10 de estas jeringas, tengo el cambio exacto.", mockItems: Array(3).fill({ icon: 'ph-syringe', color: 'green', name: 'Jeringa', price: 800 }), mockMoney: 8000, expected: { total: 8000, tendered: 8000 }, hint: "Usa el multiplicador: Digita 10 -> [qty/time] -> Digita 800 -> DEP 3. Si pagan exacto, presiona [TOTAL] directo." },
            { id: 3, type: 'sale_with_void', character: { name: 'Señor Indeciso', icon: 'ph-user', color: 'text-purple-600', role: 'Cliente' }, dialogue: "Me llevo la crema dental... espera, dejé la billetera. Solo dame la pastilla suelta.", mockItems: [{ icon: 'ph-pill', color: 'blue', name: 'Pastilla', price: 2000 }], mockMoney: 2000, expected: { total: 2000, tendered: 2000 }, hint: "Simula el error: Registra 6000 en DEP 4, presiona [void] inmediatamente. Luego registra los 2000 en DEP 2 y cobra." },
            { id: 4, type: 'po', character: { name: 'Repartidor Agua', icon: 'ph-truck', color: 'text-orange-600', role: 'Proveedor' }, dialogue: "Traigo los botellones de agua. El administrador me dijo que pagabas de la caja. Son $8.000.", mockItems: [], mockMoney: -8000, expected: { amount: 8000 }, hint: "No es venta. Digita 8000 y presiona la tecla verde [chg/PO] para registrar la salida de dinero." },
            { id: 5, type: 'sale', character: { name: 'Señora', icon: 'ph-user', color: 'text-pink-600', role: 'Cliente' }, dialogue: "Vengo por el antibiótico de mi receta, por favor. Te pago con uno de cincuenta.", mockItems: [{ icon: 'ph-pill', color: 'pink', name: 'Antibiótico', price: 17000 }], mockMoney: 50000, expected: { total: 17000, tendered: 50000 }, hint: "El antibiótico con fórmula va en DEP 1. Digita 17000 -> DEP 1 -> [ST] -> 50000 -> [TOTAL]." },
            { id: 6, type: 'sale', character: { name: 'Estudiante', icon: 'ph-user', color: 'text-yellow-600', role: 'Cliente' }, dialogue: "Deme 2 gasas de esas, por favor. Pago con esto.", mockItems: Array(2).fill({ icon: 'ph-package', color: 'yellow', name: 'Gasa', price: 1500 }), mockMoney: 5000, expected: { total: 3000, tendered: 5000 }, hint: "Usa el multiplicador para 2 unidades de 1500 en el DEP 3 (Insumos)." },
            { id: 7, type: 'po', character: { name: 'Servicio Aseo', icon: 'ph-truck', color: 'text-amber-600', role: 'Servicios' }, dialogue: "Buenas, vengo a cobrar la recolección de basuras de esta semana. Son $12.000.", mockItems: [], mockMoney: -12000, expected: { amount: 12000 }, hint: "Retiro de caja (Paid Out). Digita 12000 y presiona [chg/PO]." },
            { id: 8, type: 'sale', character: { name: 'Paciente Crónico', icon: 'ph-user', color: 'text-teal-600', role: 'Cliente' }, dialogue: "Deme mis pastillas de la presión de siempre. Aquí está el billete.", mockItems: [{ icon: 'ph-pill', color: 'teal', name: 'Medicamento', price: 45000 }], mockMoney: 50000, expected: { total: 45000, tendered: 50000 }, hint: "Medicación de fórmula. Digita 45000 -> DEP 1 -> [ST] -> 50000 -> [TOTAL]." },
            { id: 9, type: 'sale_with_void', character: { name: 'Abuelo', icon: 'ph-user', color: 'text-indigo-600', role: 'Cliente' }, dialogue: "Me llevo el jarabe de 12 mil... no, mejor solo las gotas para los ojos de 4 mil.", mockItems: [{ icon: 'ph-pill', color: 'indigo', name: 'Gotas', price: 4000 }], mockMoney: 10000, expected: { total: 4000, tendered: 10000 }, hint: "Simula el error: 12000 en DEP 2, presiona [void]. Luego registra 4000 en DEP 2, subtotal y cobra 10000." },
            { id: 10, type: 'sale', character: { name: 'Madre', icon: 'ph-user', color: 'text-rose-600', role: 'Cliente' }, dialogue: "Solo necesito una crema para el bebé, pago exacto.", mockItems: [{ icon: 'ph-package', color: 'rose', name: 'Crema Bebé', price: 5000 }], mockMoney: 5000, expected: { total: 5000, tendered: 5000 }, hint: "Cuidado Personal. 5000 en DEP 4. Como el pago es exacto, puedes presionar [TOTAL] directamente." },
            { id: 11, type: 'report_z', character: { name: 'Gerente', icon: 'ph-user-gear', color: 'text-slate-700', role: 'Cierre' }, dialogue: "¡Excelente trabajo hoy! Tu turno ha terminado. Por favor, realiza el Cierre Z de la caja para la auditoría.", mockItems: [], mockMoney: null, expected: {}, hint: "Desliza la llave a la posición 'z'. Luego presiona [TOTAL] para imprimir el reporte final." }
          ];

          const freeLevels = [
            { id: 0, type: 'ra', character: { name: 'Supervisor', icon: 'ph-user-gear', color: 'text-slate-800', role: 'Apertura' }, dialogue: "Te dejo una base más alta hoy por ser fin de mes. Son $150.000. Regístrala.", mockItems: [], mockMoney: 150000, expected: { amount: 150000 } },
            { id: 1, type: 'sale', character: { name: 'Señora Tos', icon: 'ph-user', color: 'text-pink-600', role: 'Cliente' }, dialogue: "Deme ese jarabe antialérgico, por favor. Pago con uno de $10.000.", mockItems: [{ icon: 'ph-pill', color: 'pink', name: 'Jarabe OTC', price: 5000 }], mockMoney: 10000, expected: { total: 5000, tendered: 10000 } },
            { id: 2, type: 'sale', character: { name: 'Deportista', icon: 'ph-user', color: 'text-teal-600', role: 'Cliente' }, dialogue: "Llevo 4 vendas compresivas para mi equipo. Aquí tiene.", mockItems: Array(4).fill({ icon: 'ph-package', color: 'teal', name: 'Venda', price: 2500 }), mockMoney: 20000, expected: { total: 10000, tendered: 20000 } },
            { id: 3, type: 'sale', character: { name: 'Joven', icon: 'ph-user', color: 'text-indigo-600', role: 'Cliente' }, dialogue: "Este champú para la caspa. Pago con cincuenta.", mockItems: [{ icon: 'ph-package', color: 'indigo', name: 'Champú', price: 18000 }], mockMoney: 50000, expected: { total: 18000, tendered: 50000 } },
            { id: 4, type: 'po', character: { name: 'Técnico', icon: 'ph-truck', color: 'text-amber-600', role: 'Servicios' }, dialogue: "Vengo a dejar el tóner de la impresora, son $15.000, págueme de caja.", mockItems: [], mockMoney: -15000, expected: { amount: 15000 } },
            { id: 5, type: 'sale_with_void', character: { name: 'Cliente Apurado', icon: 'ph-user', color: 'text-red-600', role: 'Cliente' }, dialogue: "Deme el termómetro de 20 mil... uy no, mejor deme solo el frasco de alcohol de 8 mil.", mockItems: [{ icon: 'ph-pill', color: 'red', name: 'Alcohol', price: 8000 }], mockMoney: 10000, expected: { total: 8000, tendered: 10000 } },
            { id: 6, type: 'sale', character: { name: 'Mamá', icon: 'ph-user', color: 'text-fuchsia-600', role: 'Cliente' }, dialogue: "Llevo la leche de fórmula del bebé. Te pago con un billete grande.", mockItems: [{ icon: 'ph-package', color: 'fuchsia', name: 'Fórmula', price: 35000 }], mockMoney: 100000, expected: { total: 35000, tendered: 100000 } },
            { id: 7, type: 'po', character: { name: 'Mensajero', icon: 'ph-truck', color: 'text-orange-600', role: 'Servicios' }, dialogue: "Hice las consignaciones en el banco, te cobro el domicilio, son $25.000.", mockItems: [], mockMoney: -25000, expected: { amount: 25000 } },
            { id: 8, type: 'sale', character: { name: 'Paciente', icon: 'ph-user', color: 'text-cyan-600', role: 'Cliente' }, dialogue: "Deme 3 tabletas sueltas de mi medicamento. Tengo cambio exacto.", mockItems: Array(3).fill({ icon: 'ph-pill', color: 'cyan', name: 'Tableta', price: 4000 }), mockMoney: 12000, expected: { total: 12000, tendered: 12000 } },
            { id: 9, type: 'sale_with_void', character: { name: 'Anciana', icon: 'ph-user', color: 'text-purple-600', role: 'Cliente' }, dialogue: "Iba a llevar la jeringa de 5 mil, pero no, solo deme el tapabocas de 1.500.", mockItems: [{ icon: 'ph-package', color: 'purple', name: 'Tapaboca', price: 1500 }], mockMoney: 2000, expected: { total: 1500, tendered: 2000 } },
            { id: 10, type: 'sale', character: { name: 'Turista', icon: 'ph-user', color: 'text-lime-600', role: 'Cliente' }, dialogue: "Necesito un bloqueador solar urgente. Toma $50.000.", mockItems: [{ icon: 'ph-package', color: 'lime', name: 'Bloqueador', price: 22000 }], mockMoney: 50000, expected: { total: 22000, tendered: 50000 } },
            { id: 11, type: 'report_z', character: { name: 'Supervisor', icon: 'ph-user-gear', color: 'text-slate-800', role: 'Cierre' }, dialogue: "Listo, cierra tu caja emitiendo el Reporte Z. Entrégame el informe para cuadrar.", mockItems: [], mockMoney: null, expected: {} }
          ];

          const activeLevels = gameMode === 'guided' ? guidedLevels : freeLevels;
          const currentCustomer = activeLevels[currentLevel] || activeLevels[0];

          // --- START & RESET ---
          const startGame = (mode) => {
              setGameMode(mode);
              setCurrentLevel(0);
              setRegisterMode('reg1');
              resetRegister();
              setShowManual(false);
          };

          const returnToMenu = () => {
              setGameMode('menu');
              resetRegister();
          };

          const resetRegister = () => {
              setReceipt([]);
              setTotal(0);
              setDisplay('0');
              setDrawerCash(0);
              setLastCompletedTx(null);
              setDrawerOpen(false);
              setEvaluation({ status: 'none', message: '', isFinal: false });
              setErrorState(false);
              setStatusIndicator('');
              setMultiplier(1);
          };

          // --- EVALUATION LOGIC ---
          const evaluateTransaction = () => {
              if (!lastCompletedTx) {
                  setEvaluation({ status: 'error', message: 'No has cerrado ninguna operación. ¡Termina de atender en la registradora primero!', isFinal: false });
                  return;
              }
              
              if (lastCompletedTx.type === 'report' && currentCustomer.type !== 'report_z') {
                  setEvaluation({ status: 'error', message: `Generaste un reporte ${lastCompletedTx.mode.toUpperCase()} en lugar de atender al cliente. Asegúrate de estar en modo REG1 o REG2.`, isFinal: false });
                  return;
              }

              const expected = currentCustomer.expected;

              if (currentCustomer.type === 'sale' || currentCustomer.type === 'sale_with_void') {
                  if (lastCompletedTx.type !== 'sale') {
                      setEvaluation({ status: 'error', message: 'Te equivocaste de operación. Esto era una venta normal.', isFinal: false }); return;
                  }
                  if (lastCompletedTx.total !== expected.total) {
                      setEvaluation({ status: 'error', message: `Le cobraste ${formatCurrency(lastCompletedTx.total)} al cliente, pero el total correcto era ${formatCurrency(expected.total)}.`, isFinal: false }); return;
                  }
                  if (lastCompletedTx.tendered !== expected.tendered) {
                      setEvaluation({ status: 'error', message: `El cliente te dio ${formatCurrency(expected.tendered)}, pero tú registraste ${formatCurrency(lastCompletedTx.tendered)} en efectivo.`, isFinal: false }); return;
                  }
                  if (currentCustomer.type === 'sale_with_void') {
                      const hasVoid = receipt.some(r => r.type === 'void');
                      if (!hasVoid) {
                         setEvaluation({ status: 'error', message: '¡No usaste la tecla VOID! Debías simular el error marcando el primer artículo y luego anulándolo.', isFinal: false }); return;
                      }
                  }
              } else if (currentCustomer.type === 'po') {
                  if (lastCompletedTx.type !== 'po') {
                      setEvaluation({ status: 'error', message: '¡Error! Debías registrar esto como un pago a proveedor usando la tecla [PO].', isFinal: false }); return;
                  }
                  if (lastCompletedTx.amount !== expected.amount) {
                      setEvaluation({ status: 'error', message: `El proveedor necesitaba ${formatCurrency(expected.amount)} pero registraste ${formatCurrency(lastCompletedTx.amount)}.`, isFinal: false }); return;
                  }
              } else if (currentCustomer.type === 'ra') {
                  if (lastCompletedTx.type !== 'ra') {
                      setEvaluation({ status: 'error', message: '¡Error! Esto era un ingreso de base, debías usar la tecla [RA].', isFinal: false }); return;
                  }
                  if (lastCompletedTx.amount !== expected.amount) {
                      setEvaluation({ status: 'error', message: `La base era de ${formatCurrency(expected.amount)} pero registraste ${formatCurrency(lastCompletedTx.amount)}.`, isFinal: false }); return;
                  }
              } else if (currentCustomer.type === 'report_z') {
                  if (lastCompletedTx.type !== 'report' || lastCompletedTx.mode !== 'z') {
                      setEvaluation({ status: 'error', message: '¡Error! Debías generar el Reporte Z de fin de turno. Asegúrate de mover la llave a Z y presionar TOTAL.', isFinal: false }); return;
                  }
              }

              if (currentLevel === activeLevels.length - 1) {
                  setEvaluation({ status: 'success', message: '¡Turno finalizado y caja auditada correctamente! Gran trabajo.', isFinal: true });
              } else {
                  setEvaluation({ status: 'success', message: '¡Operación perfecta! El balance de la caja es correcto.', isFinal: false });
              }
          };

          const nextLevel = () => {
              if (evaluation.isFinal) {
                  returnToMenu();
              } else {
                  setReceipt([]); setTotal(0); setDisplay('0'); setLastCompletedTx(null);
                  setDrawerOpen(false); setEvaluation({ status: 'none', message: '', isFinal: false });
                  setCurrentLevel(currentLevel + 1);
              }
          };

          const retryLevel = () => {
              setReceipt([]); setTotal(0); setDisplay('0'); setLastCompletedTx(null);
              setDrawerOpen(false); setEvaluation({ status: 'none', message: '', isFinal: false });
              setErrorState(false); setStatusIndicator(''); setMultiplier(1);
          };

          // --- DISPLAY & STYLES ---
          let lcdText = display;
          let lcdBg = errorState ? 'bg-red-200' : 'bg-[#9fb39f]';
          let lcdTextColor = errorState ? 'text-red-900' : 'text-[#1a2b1a]';

          if (registerMode === 'off') {
              lcdText = ''; lcdBg = 'bg-[#6b7a6b]'; 
          } else if (registerMode === 'x' && display === '0' && !errorState) {

          } else if (registerMode === 'z' && display === '0' && !errorState) {

          } else if (registerMode === 'prog' && display === '0' && !errorState) {
              lcdText = 'P 0.00';
          }

          const btnBlack = "bg-[#111] text-gray-100 hover:bg-[#222] rounded shadow-md border-b-4 border-black active:border-b-0 active:translate-y-1 flex flex-col items-center justify-center p-1 text-[11px] lg:text-xs select-none transition-all";

          const btnOrange = "bg-[#f97316] text-white hover:bg-[#ea580c] rounded shadow-md border-b-4 border-[#9a3412] active:border-b-0 active:translate-y-1 flex items-center justify-center p-1 text-2xl font-bold col-span-2 select-none transition-all";

          const MODES = ['off', 'reg1', 'reg2', 'x', 'z', 'prog'];

              'off': '0%', 'reg1': '18%', 'reg2': '38%', 'x': '57%', 'z': '76%', 'prog': 'calc(100% - 24px)'

          // --- MAIN MENU RENDER ---
          if (gameMode === 'menu') {
            return (
              <div className="flex flex-col h-screen w-full bg-slate-900 items-center justify-center font-sans text-white relative overflow-hidden overflow-y-auto">

                <div className="z-10 text-center mb-8 lg:mb-12 mt-10">
                    <h1 className="text-4xl lg:text-5xl font-black mb-2 tracking-tight text-emerald-400 font-serif italic drop-shadow-lg">ROYAL <span className="text-white font-sans not-italic font-bold">410DX</span></h1>
                    <p className="text-sm lg:text-xl text-slate-300 font-medium tracking-wide uppercase px-4">Simulador de Turno Farmacéutico</p>
                </div>

                <div className="flex flex-col lg:flex-row flex-wrap justify-center gap-6 z-10 max-w-6xl px-4 pb-12 w-full">
                   {/* GUIDED MODE */}
                   <div 
                     onClick={() => startGame('guided')}
                     className="w-full lg:w-[300px] bg-slate-800 border-2 border-slate-700 hover:border-emerald-500 rounded-2xl p-6 flex flex-col items-center cursor-pointer transition-all hover:scale-105 shadow-2xl group"
                   >
                      <div className="w-16 h-16 bg-slate-700 group-hover:bg-emerald-500 rounded-full flex items-center justify-center mb-4 transition-colors">
                         <i className="ph-bold ph-book-open text-3xl text-emerald-400 group-hover:text-white"></i>
                      </div>
                      <h2 className="text-xl font-bold mb-2 text-white">Práctica Guiada</h2>
                      <p className="text-slate-400 text-center text-xs mb-6 px-2">
                        Turno de 8 horas. 12 eventos con instrucciones, pistas y explicaciones detalladas.
                      </p>
                      <button className="mt-auto px-4 py-3 lg:py-2 bg-emerald-600/20 text-emerald-400 font-bold rounded-full group-hover:bg-emerald-500 group-hover:text-white transition-colors w-full border border-emerald-500/50 text-sm">
                        Iniciar Tutorial
                      </button>
                   </div>

                   {/* FREE MODE */}
                   <div 
                     onClick={() => startGame('free')}
                     className="w-full lg:w-[300px] bg-slate-800 border-2 border-slate-700 hover:border-blue-500 rounded-2xl p-6 flex flex-col items-center cursor-pointer transition-all hover:scale-105 shadow-2xl group"
                   >
                      <div className="w-16 h-16 bg-slate-700 group-hover:bg-blue-500 rounded-full flex items-center justify-center mb-4 transition-colors">
                         <i className="ph-bold ph-graduation-cap text-3xl text-blue-400 group-hover:text-white"></i>
                      </div>
                      <h2 className="text-xl font-bold mb-2 text-white">Práctica Libre</h2>
                      <p className="text-slate-400 text-center text-xs mb-6 px-2">
                        Turno de 8 horas. 12 casos desafiantes sin pistas. Atiende a los clientes por tu cuenta.
                      </p>
                      <button className="mt-auto px-4 py-3 lg:py-2 bg-blue-600/20 text-blue-400 font-bold rounded-full group-hover:bg-blue-500 group-hover:text-white transition-colors w-full border border-blue-500/50 text-sm">
                        Iniciar Evaluación
                      </button>
                   </div>

                   {/* SANDBOX MODE */}
                   <div 
                     onClick={() => startGame('sandbox')}
                     className="w-full lg:w-[300px] bg-slate-800 border-2 border-slate-700 hover:border-purple-500 rounded-2xl p-6 flex flex-col items-center cursor-pointer transition-all hover:scale-105 shadow-2xl group"
                   >
                      <div className="w-16 h-16 bg-slate-700 group-hover:bg-purple-500 rounded-full flex items-center justify-center mb-4 transition-colors">
                         <i className="ph-bold ph-play-square text-3xl text-purple-400 group-hover:text-white"></i>
                      </div>
                      <h2 className="text-xl font-bold mb-2 text-white">Modo Sandbox</h2>
                      <p className="text-slate-400 text-center text-xs mb-6 px-2">
                        Práctica abierta sin clientes. Explora la registradora y sus reportes (X/Z) libremente.
                      </p>
                      <button className="mt-auto px-4 py-3 lg:py-2 bg-purple-600/20 text-purple-400 font-bold rounded-full group-hover:bg-purple-500 group-hover:text-white transition-colors w-full border border-purple-500/50 text-sm">
                        Entrar a Caja
                      </button>
                   </div>
                </div>
              </div>
            );
          }

          // --- GAME UI RENDER ---
          return (
            <div className="flex flex-col lg:flex-row h-screen w-full bg-slate-100 font-sans text-neutral-800 overflow-hidden relative">
              
              {/* EVALUATION OVERLAY */}
              {gameMode !== 'sandbox' && evaluation.status !== 'none' && (
                <div className="absolute inset-0 bg-black/60 z-50 flex justify-center items-center backdrop-blur-sm p-4">
                   <div className={`w-full max-w-[450px] bg-white rounded-2xl shadow-2xl p-6 lg:p-8 flex flex-col items-center text-center transform transition-transform ${evaluation.status === 'success' ? 'border-4 border-emerald-500' : 'border-4 border-red-500'}`}>
                      
                      {evaluation.status === 'success' ? (
                         <>
                           <div className="w-16 h-16 lg:w-20 lg:h-20 rounded-full bg-emerald-100 flex items-center justify-center mb-4 text-emerald-600">
                             <i className="ph-fill ph-stamp text-4xl lg:text-5xl"></i>
                           </div>
                           <h2 className="text-2xl lg:text-3xl font-black text-emerald-600 tracking-wide mb-2 uppercase">
                              {evaluation.isFinal ? '¡Turno Terminado!' : '¡Aprobado!'}

                           <p className="text-slate-600 mb-6 font-medium text-sm lg:text-base">{evaluation.message}</p>
                           <button onClick={nextLevel} className="w-full py-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-lg transition-all text-base lg:text-lg flex justify-center items-center gap-2">
                             {evaluation.isFinal ? <><i className="ph-bold ph-house text-xl lg:text-2xl"></i> Volver al Menú</> : <>Siguiente Caso <i className="ph-bold ph-caret-right text-xl lg:text-2xl"></i></>}
                           </button>
                         </>
                      ) : (
                         <>
                           <div className="w-16 h-16 lg:w-20 lg:h-20 rounded-full bg-red-100 flex items-center justify-center mb-4 text-red-600">
                             <i className="ph-bold ph-warning-circle text-4xl lg:text-5xl"></i>
                           </div>
                           <h2 className="text-2xl lg:text-3xl font-black text-red-600 tracking-wide mb-2 uppercase">Error Operativo</h2>
                           <p className="text-slate-600 mb-6 text-sm lg:text-base">{evaluation.message}</p>
                           <button onClick={retryLevel} className="w-full py-4 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-xl shadow-lg transition-all text-base lg:text-lg flex justify-center items-center gap-2">
                             <i className="ph-bold ph-arrows-clockwise text-xl lg:text-2xl"></i> Corregir Error
                           </button>
                         </>
                      )}
                   </div>
                </div>
              )}

              {/* TOP BAR MOBILE */}
              {gameMode !== 'menu' && (
                <div className="flex items-center justify-between p-3 bg-slate-800 text-white lg:hidden z-30 shadow-md flex-shrink-0">
                   <button onClick={returnToMenu} className="flex items-center gap-2 font-bold text-sm bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-600">
                       <i className="ph-bold ph-house text-lg"></i> Menú
                   </button>
                   <button onClick={() => setShowManual(true)} className="flex items-center gap-2 bg-emerald-600 px-3 py-1.5 rounded-lg font-bold text-sm shadow border border-emerald-500">
                       <i className="ph-bold ph-book-open text-lg"></i> Ver Manual
                   </button>
                </div>
              )}

              {/* TOP BAR DESKTOP */}
              {gameMode !== 'menu' && (
                <div className="hidden lg:flex absolute top-4 left-4 z-30">
                    <button 
                      onClick={returnToMenu}
                      className="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 text-white px-3 py-1.5 rounded-lg shadow border border-slate-600 text-xs font-bold transition-colors"
                    >
                       <i className="ph-bold ph-house text-lg"></i> Menú Principal
                    </button>
                </div>
              )}

              {/* LEFT PANEL: MANUAL CHEAT SHEET (RESPONSIVE DRAWER) */}
              {showManual && (
                  <div className="fixed inset-0 bg-black/60 z-40 lg:hidden backdrop-blur-sm transition-opacity" onClick={() => setShowManual(false)}></div>
              )}
              
              <div className={`fixed inset-y-0 left-0 z-50 lg:relative lg:z-20 w-[85%] max-w-[340px] lg:w-80 lg:max-w-none bg-white border-r border-slate-300 flex flex-col shadow-2xl lg:shadow-xl transform transition-transform duration-300 ease-in-out ${showManual ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'} pt-0 lg:pt-12`}>
                
                <button onClick={() => setShowManual(false)} className="absolute top-4 right-4 bg-white/20 hover:bg-white/40 text-white rounded-full p-1 lg:hidden transition-colors">
                    <i className="ph-bold ph-x text-xl"></i>
                </button>

                <div className={`p-5 border-b border-slate-200 text-white ${gameMode === 'guided' ? 'bg-emerald-700' : gameMode === 'free' ? 'bg-blue-800' : 'bg-purple-800'} pt-8 lg:pt-5`}>
                  <div className="flex items-center gap-3">
                    <div className={`p-2 rounded-lg ${gameMode === 'guided' ? 'bg-emerald-600 text-emerald-100' : gameMode === 'free' ? 'bg-blue-700 text-blue-100' : 'bg-purple-700 text-purple-100'}`}>
                      <i className="ph-bold ph-book-open text-2xl"></i>
                    </div>
                    <div>
                      <h1 className="text-lg font-bold">Manual Rápido</h1>
                      <p className="text-xs opacity-80 uppercase tracking-wider">
                        {gameMode === 'guided' ? 'Modo Guiado' : gameMode === 'free' ? 'Modo Libre' : 'Modo Sandbox'}
                      </p>
                    </div>
                  </div>
                </div>

                <div className="flex-1 overflow-y-auto p-4 lg:p-5 text-sm custom-scrollbar relative">
                   <h3 className="font-bold text-slate-700 mb-3 uppercase text-xs tracking-wider border-b pb-2">Procesos Comunes</h3>
                   <div className="space-y-4 mb-6">
                      <div>
                         <strong className="text-slate-800 block mb-1">1. Venta Normal</strong>
                         <ol className="list-decimal pl-4 text-slate-600 space-y-1 text-[11px] lg:text-xs">
                            <li>Llave en <span className="font-mono bg-slate-100 px-1 border rounded">reg1</span>.</li>
                            <li>Digita precio.</li>
                            <li>Presiona Depto <span className="font-mono bg-slate-100 px-1 border rounded">2/10</span>.</li>
                            <li>Presiona azul <span className="font-mono bg-blue-100 text-blue-800 px-1 border border-blue-200 rounded">#/ST/NS</span>.</li>
                            <li>Digita dinero recibido.</li>
                            <li>Presiona azul ancho <span className="font-mono bg-blue-100 text-blue-800 px-1 border border-blue-200 rounded">TOTAL</span>.</li>
                         </ol>
                      </div>
                      <div>
                         <strong className="text-slate-800 block mb-1">2. Venta Múltiple</strong>
                         <ol className="list-decimal pl-4 text-slate-600 space-y-1 text-[11px] lg:text-xs">
                            <li>Digita cantidad.</li>
                            <li>Presiona negra <span className="font-mono bg-slate-100 px-1 border rounded">qty/time</span>.</li>
                            <li>Sigue con Venta Normal.</li>
                         </ol>
                      </div>
                      <div>
                         <strong className="text-slate-800 block mb-1">3. Salidas y Entradas</strong>
                         <ul className="list-disc pl-4 text-slate-600 space-y-1 text-[11px] lg:text-xs">
                            <li><strong>Pagar proveedor:</strong> Monto + <span className="font-mono bg-green-100 text-green-800 px-1 border border-green-200 rounded">PO</span>.</li>
                            <li><strong>Ingresar base:</strong> Monto + <span className="font-mono bg-green-100 text-green-800 px-1 border border-green-200 rounded">RA</span>.</li>
                         </ul>
                      </div>
                   </div>

                   <div className="mt-2 border-t pt-4">
                      <button onClick={() => setFaqOpen(!faqOpen)} className="w-full flex items-center justify-between font-bold text-slate-700 uppercase text-xs tracking-wider bg-slate-50 p-2 rounded-lg border border-slate-200 hover:bg-slate-100 transition-colors">
                        <div className="flex items-center gap-2">
                          <i className="ph-bold ph-question text-base text-slate-500"></i>
                          <span>FAQ</span>
                        </div>
                        <i className={`ph-bold ph-caret-right text-base transform transition-transform ${faqOpen ? 'rotate-90 text-blue-500' : 'text-slate-400'}`}></i>
                      </button>

                      {faqOpen && (
                        <div className="mt-3 space-y-3 text-[11px] lg:text-xs text-slate-600 pb-4 px-1">
                           <details className="group border-b border-slate-100 pb-2">
                              <summary className="font-semibold text-slate-700 cursor-pointer list-none flex items-start gap-1">
                                 <i className="ph-bold ph-caret-right text-sm group-open:rotate-90 transition-transform mt-0.5 text-slate-400 flex-shrink-0"></i>
                                 ¿Llave de Modos?
                              </summary>
                              <p className="pl-5 mt-1 leading-relaxed"><strong>OFF:</strong> Apaga. <strong>REG1/2:</strong> Venta. <strong>X:</strong> Lectura. <strong>Z:</strong> Cierre y reseteo a $0.</p>
                           </details>
                           <details className="group border-b border-slate-100 pb-2">
                              <summary className="font-semibold text-slate-700 cursor-pointer list-none flex items-start gap-1">
                                 <i className="ph-bold ph-caret-right text-sm group-open:rotate-90 transition-transform mt-0.5 text-slate-400 flex-shrink-0"></i>
                                 ¿Me equivoqué en precio?
                              </summary>
                              <p className="pl-5 mt-1 leading-relaxed">Antes de Depto: Usa la tecla naranja <strong className="bg-orange-500 text-white px-1 rounded shadow-sm">C</strong>.</p>
                           </details>
                           <details className="group border-b border-slate-100 pb-2">
                              <summary className="font-semibold text-slate-700 cursor-pointer list-none flex items-start gap-1">
                                 <i className="ph-bold ph-caret-right text-sm group-open:rotate-90 transition-transform mt-0.5 text-slate-400 flex-shrink-0"></i>
                                 ¿Ya presioné Depto?
                              </summary>
                              <p className="pl-5 mt-1 leading-relaxed">Presiona <strong className="bg-slate-800 text-white px-1 rounded border border-slate-600">void</strong> (esquina sup. izq) al instante.</p>
                           </details>
                           <details className="group border-b border-slate-100 pb-2">
                              <summary className="font-semibold text-slate-700 cursor-pointer list-none flex items-start gap-1">
                                 <i className="ph-bold ph-caret-right text-sm group-open:rotate-90 transition-transform mt-0.5 text-slate-400 flex-shrink-0"></i>
                                 ¿Máquina bloqueada (E)?
                              </summary>
                              <p className="pl-5 mt-1 text-red-700 font-medium">Presiona <strong className="bg-orange-500 text-white px-1 rounded shadow-sm">C</strong> para desbloquearla.</p>
                           </details>
                        </div>
                      )}
                   </div>
                </div>
              </div>

              {/* RIGHT PANEL: SIMULATION ENVIRONMENT */}
              <div className="flex-1 flex flex-col bg-slate-300 relative overflow-y-auto overflow-x-hidden w-full">
                
                <div className="p-4 lg:px-8 lg:pt-6 pb-2">
                   
                   {/* Top Row: Clock / Spacer */}
                   <div className="flex justify-between items-center mb-2 lg:mb-4 min-h-[40px]">
                       <div></div> {/* Empty left space */}
                       {gameMode !== 'sandbox' && (
                          <div className="flex items-center gap-2 lg:gap-3 bg-slate-800 text-white px-3 py-1.5 lg:px-4 lg:py-2 rounded-xl shadow-lg border border-slate-600 shrink-0">
                             <i className="ph-bold ph-clock text-xl lg:text-2xl text-emerald-400"></i>
                             <div className="flex flex-col">
                                 <span className="text-[9px] lg:text-[10px] uppercase font-bold text-slate-400 leading-none mb-0.5">Turno 8 Horas</span>

                             </div>

                       )}
                   </div>

                   {/* THE COUNTER (Responsive) */}
                   {gameMode === 'sandbox' ? (
                     <div className="bg-white rounded-2xl shadow-md border border-slate-300 flex flex-col justify-center items-center h-24 lg:h-28 relative overflow-hidden">

                     </div>
                   ) : (
                     <div className="bg-white rounded-2xl shadow-md border border-slate-300 flex flex-col flex-shrink-0 relative overflow-hidden">
                       <div className={`absolute top-0 left-0 w-full h-1 ${gameMode === 'guided' ? 'bg-gradient-to-r from-emerald-400 to-teal-500' : 'bg-gradient-to-r from-blue-400 to-indigo-500'}`}></div>
                       
                       <div className="flex flex-col sm:flex-row items-stretch">

                                <i className={`ph-fill ${currentCustomer.character.icon} text-3xl lg:text-4xl`}></i>
                             </div>
                             <div className="relative flex-1">
                                <div className="text-[10px] lg:text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">{currentCustomer.character.role} - Evento {currentLevel + 1}/12</div>

                                </div>
                             </div>
                          </div>

                          {/* Items & Money */}
                          <div className="w-full sm:w-1/2 p-3 lg:p-4 flex items-center justify-center gap-4 lg:gap-6 min-h-[80px]">
                              <div className="flex items-end gap-1.5 lg:gap-2">
                                 {currentCustomer.mockItems.map((item, i) => (
                                      <div key={i} className={`bg-${item.color}-50 border border-${item.color}-200 p-1.5 lg:p-2 rounded-lg flex flex-col items-center shadow-sm relative ${i > 0 ? '-ml-4 lg:-ml-6' : ''}`} style={{zIndex: 10-i}}>

                                          <span className="bg-white px-1 py-0.5 rounded text-[9px] lg:text-[10px] font-bold shadow-sm text-slate-700 border border-slate-100">{formatCurrency(item.price)}</span>
                                      </div>
                                 ))}
                                 {currentCustomer.mockItems.length === 0 && (
                                     <div className="text-slate-400 text-xs lg:text-sm font-medium flex items-center gap-1.5 lg:gap-2 bg-slate-50 px-3 py-1.5 lg:px-4 lg:py-2 rounded-lg border border-slate-200">
                                         <i className="ph-bold ph-wallet text-lg lg:text-xl"></i> {currentCustomer.type === 'report_z' ? 'Auditoría' : 'Flujo Manual'}

                                 )}
                              </div>

                              <div className="flex items-center gap-2">
                                 {currentCustomer.mockMoney > 0 && (
                                    <div className="bg-emerald-600 text-white font-mono font-bold py-1 px-2 lg:py-1.5 lg:px-4 rounded-sm shadow-md transform -rotate-3 border-2 border-emerald-800 text-[10px] lg:text-sm whitespace-nowrap">
                                      {formatCurrency(currentCustomer.mockMoney)} COP
                                    </div>
                                 )}
                                 {currentCustomer.mockMoney < 0 && (
                                    <div className="text-red-600 font-bold font-mono text-[10px] lg:text-sm border-2 border-red-200 bg-red-50 py-1 px-2 lg:py-1.5 lg:px-3 rounded-sm shadow-sm whitespace-nowrap">
                                      Dar: {formatCurrency(Math.abs(currentCustomer.mockMoney))}
                                    </div>
                                 )}
                              </div>
                          </div>
                       </div>
                     </div>
                   )}

                   {/* HINT BUBBLE */}
                   {gameMode === 'guided' && currentCustomer.hint && (
                     <div className="mt-3 flex items-start lg:items-center gap-2 text-xs lg:text-sm text-slate-600 bg-yellow-50 p-2 lg:px-4 rounded-lg border border-yellow-200 shadow-sm">
                         <span className="font-bold text-yellow-700 flex-shrink-0">Pista:</span> <span className="leading-tight">{currentCustomer.hint}</span>
                     </div>
                   )}

                {/* THE SCALED CASH REGISTER CONTAINER */}
                <div ref={registerContainerRef} className="w-full flex-1 flex flex-col items-center justify-start pt-4 lg:pt-6 pb-24 px-2">
                  
                  {/* Wrapper defining explicit size bound by scaled element */}
                  <div style={{ width: `${700 * scale}px`, height: `${850 * scale}px` }} className="relative flex justify-center">
                    
                    {/* The scaled element (Origin Top Center) */}
                    <div style={{ transform: `scale(${scale})`, transformOrigin: 'top center', position: 'absolute', top: 0, width: '700px' }} className="flex flex-col items-center">
                       
                       {/* Register Body */}
                       <div className="w-[700px] bg-[#1c1c1c] rounded-2xl shadow-2xl relative flex flex-col p-6 border-b-[16px] border-[#0a0a0a] z-20 flex-shrink-0">
                          
                          {/* Top Area: Printer, LCD, Switch */}
                          <div className="flex w-full h-44 mb-2">
                             
                             <div className="w-1/3 relative">
                                <div className="absolute -top-12 left-4 w-48 h-52 bg-[#fcfcfc] shadow-[0_-5px_15px_rgba(0,0,0,0.2)] border-x border-t border-slate-300 flex flex-col z-10 rounded-t-sm">
                                   <div className="flex-1 overflow-y-auto p-4 font-mono text-[11px] leading-tight text-neutral-800 flex flex-col scrollbar-hide pb-12">
                                      <div className="text-center font-bold mb-3 pb-2 border-b border-dashed border-neutral-400">
                                        FARMACIA ROYAL<br/>
                                        SIMULADOR 410DX<br/>
                                        {new Date().toLocaleDateString('es-CO')}
                                      </div>
                                      {receipt.map((line, i) => (
                                        <div key={i} className={`flex justify-between w-full ${line.type === 'total' ? 'font-bold text-[13px] mt-2 border-t border-slate-300 pt-1' : ''} ${line.type === 'void' ? 'text-red-600 line-through' : ''}`}>
                                          {line.label ? (
                                            <><span>{line.label}</span><span>{line.value}</span></>
                                          ) : (
                                            <span className="w-full text-center text-slate-500">{line.text}</span>
                                          )}
                                        </div>
                                      ))}
                                      <div ref={receiptEndRef} />
                                   </div>
                                   <div className="absolute bottom-0 w-full h-8 bg-gradient-to-t from-[#111] to-transparent"></div>
                                </div>
                             </div>

                             <div className="w-2/3 flex flex-col items-end pt-2 pr-2">
                                 <div className={`w-[320px] h-20 ${lcdBg} rounded-lg border-[10px] border-[#0f0f0f] shadow-[inset_0_5px_10px_rgba(0,0,0,0.6)] flex flex-col justify-center px-4 font-mono relative mb-2 transition-colors`}>
                                    <div className="absolute top-1 left-2 text-[10px] font-bold text-slate-700/60 opacity-80">{statusIndicator}</div>
                                    <div className={`text-right text-4xl font-bold tracking-widest ${lcdTextColor}`}>{lcdText}</div>
                                 </div>
                                 
                                 <div className="w-[320px] text-right text-white font-serif italic text-xl font-bold tracking-widest mb-3 pr-2">
                                     ROYAL
                                 </div>
                                 
                                 <div className="w-[280px] flex flex-col items-center pl-8">
                                     <div className="flex gap-4 text-[11px] font-bold mb-1.5 font-sans w-[210px] justify-between relative px-2">
                                        {MODES.map((mode) => (
                                           <div key={mode} onClick={() => setRegisterMode(mode)} className={`flex flex-col items-center cursor-pointer z-10 ${registerMode === mode ? 'text-white' : 'text-slate-400 hover:text-slate-300'}`}>
                                              <span>{mode}</span>
                                              {registerMode === mode && <div className="w-1 h-1 bg-emerald-500 rounded-full absolute -bottom-1"></div>}
                                           </div>
                                        ))}
                                     </div>
                                     <div className="relative w-[210px] h-4 bg-black rounded-full shadow-[inset_0_2px_4px_rgba(0,0,0,0.8)] border border-[#333] mb-1">
                                        <div className="absolute top-0 w-6 h-6 bg-slate-300 rounded cursor-pointer border-b-2 border-slate-500 shadow-md transform -translate-y-1 transition-all duration-200 ease-out" style={{ left: MODE_POSITIONS[registerMode] }}></div>
                                     </div>
                                     <div className="w-[180px] h-2 bg-[#1d4ed8] rounded-t-sm shadow-sm mt-1"></div>
                                 </div>
                             </div>
                          </div>

                          <div className="w-full bg-[#262626] p-5 rounded-xl shadow-[inset_0_4px_15px_rgba(0,0,0,0.5)] border-t border-[#333] grid grid-cols-9 gap-1.5 mt-2">
                             <button className={btnBlack} onClick={() => {}}><i className="ph-bold ph-arrow-up text-base mb-0.5"></i><span className="font-bold text-[10px]">Feed</span></button>
                             <button className={btnBlack} onClick={handleVoid}><span className="font-bold">void</span><span className="text-[9px] text-slate-400">(text)</span></button>
                             <button className={`${btnBlack} text-xl font-bold`} onClick={() => handleNumber('7')}>7</button>
                             <button className={`${btnBlack} text-xl font-bold`} onClick={() => handleNumber('8')}>8</button>
                             <button className={`${btnBlack} text-xl font-bold`} onClick={() => handleNumber('9')}>9</button>
                             <button className={btnBlack} onClick={() => handleDept(4, 'DEP 4')}><span className="font-bold text-[11px]">4/12</span><span className="text-[9px] text-slate-400">A/N</span></button>
                             <button className={btnBlack} onClick={() => handleDept(8, 'DEP 8')}><span className="font-bold text-[11px]">8/16</span><span className="text-[9px] text-slate-400">B/O</span></button>
                             <button className={btnBlack} onClick={() => {}}><span className="font-bold text-[11px]">PLU</span><span className="text-[9px] text-slate-400">C/P</span></button>
                             <button className={btnBlack} onClick={() => {}}><span className="font-bold text-[10px] leading-tight text-center">dept<br/>shift</span></button>

                             <button className={btnGreen} onClick={() => {}}><span className="font-bold">-%</span><span className="text-[9px] text-green-200">(caps)</span></button>
                             <button className={btnGreen} onClick={() => {}}><span className="font-bold">ref/-</span><span className="text-[9px] text-green-200">(DW)</span></button>
                             <button className={`${btnBlack} text-xl font-bold`} onClick={() => handleNumber('4')}>4</button>
                             <button className={`${btnBlack} text-xl font-bold`} onClick={() => handleNumber('5')}>5</button>
                             <button className={`${btnBlack} text-xl font-bold`} onClick={() => handleNumber('6')}>6</button>
                             <button className={btnBlack} onClick={() => handleDept(3, 'DEP 3')}><span className="font-bold text-[11px]">3/11</span><span className="text-[9px] text-slate-400">D/Q</span></button>
                             <button className={btnBlack} onClick={() => handleDept(7, 'DEP 7')}><span className="font-bold text-[11px]">7/15</span><span className="text-[9px] text-slate-400">E/R</span></button>
                             <button className={btnBlack} onClick={() => {}}><span className="font-bold text-[10px] leading-tight text-center">tax<br/>shift</span><span className="text-[9px] text-slate-400 mt-0.5">F/S</span></button>
                             <button className={btnGreen} onClick={handleReceivedOnAccount}><span className="font-bold text-[11px]">chk/RA</span><span className="text-[9px] text-green-200">G/T</span></button>

                             <button className={btnBlack} onClick={() => {}}><span className="font-bold text-[11px]">Clerk</span><span className="text-[9px] text-slate-400">(BS)</span></button>
                             <button className={btnBlack} onClick={handleQtyTime}><span className="font-bold text-[11px]">qty/time</span><span className="text-[9px] text-slate-400">(num)</span></button>
                             <button className={`${btnBlack} text-xl font-bold`} onClick={() => handleNumber('1')}>1</button>
                             <button className={`${btnBlack} text-xl font-bold`} onClick={() => handleNumber('2')}>2</button>
                             <button className={`${btnBlack} text-xl font-bold`} onClick={() => handleNumber('3')}>3</button>
                             <button className={btnBlack} onClick={() => handleDept(2, 'DEP 2')}><span className="font-bold text-[11px]">2/10</span><span className="text-[9px] text-slate-400">H/U</span></button>
                             <button className={btnBlack} onClick={() => handleDept(6, 'DEP 6')}><span className="font-bold text-[11px]">6/14</span><span className="text-[9px] text-slate-400">I/V</span></button>
                             <button className={btnBlue} onClick={handleSubtotalNS}><span className="font-bold text-[10px]">#/ST/NS</span><span className="text-[9px] text-blue-200">J/W</span></button>
                             <button className={btnGreen} onClick={handlePaidOut}><span className="font-bold text-[11px]">chg/PO</span><span className="text-[9px] text-green-200">K/X</span></button>

                             <button className={btnOrange} onClick={handleClear}>C</button>
                             <button className={`${btnBlack} text-xl font-bold`} onClick={() => handleNumber('0')}>0</button>
                             <button className={`${btnBlack} text-lg font-bold`} onClick={() => handleNumber('00')}>00</button>
                             <button className={btnBlack} onClick={() => handleNumber('.')}><span className="font-bold text-xl leading-none">.</span><span className="text-[8px] text-slate-400">(space)</span></button>
                             <button className={btnBlack} onClick={() => handleDept(1, 'DEP 1')}><span className="font-bold text-[11px]">1/9</span><span className="text-[9px] text-slate-400">L/Y</span></button>
                             <button className={btnBlack} onClick={() => handleDept(5, 'DEP 5')}><span className="font-bold text-[11px]">5/13</span><span className="text-[9px] text-slate-400">M/Z</span></button>
                             <button className={`${btnBlue} col-span-2 pt-1.5`} onClick={handleCash}><span className="font-bold text-[10px] leading-tight">amount tend</span><span className="font-black text-sm leading-tight tracking-wide">TOTAL</span><span className="text-[9px] text-blue-200 leading-tight">(enter)</span></button>
                          </div>
                          
                          <div className="absolute -bottom-36 left-1/2 transform -translate-x-1/2 w-full max-w-[650px] z-[-1] flex justify-center">
                            <div className={`w-[630px] h-36 bg-[#111] rounded-b-xl shadow-2xl border-b-[8px] border-x-4 border-[#080808] transition-all duration-500 ease-out flex overflow-hidden p-3 gap-2 ${drawerOpen ? 'translate-y-0 opacity-100' : '-translate-y-20 opacity-0 pointer-events-none'}`}>
                               {Array.from({length: 4}).map((_, i) => (
                                  <div key={i} className="flex-1 bg-[#1f1f1f] border-2 border-[#0a0a0a] shadow-inner flex flex-col items-center justify-end relative rounded-sm p-1">
                                     <div className="absolute top-0 w-8 h-12 bg-gradient-to-b from-slate-400 to-slate-500 rounded-sm shadow-[0_3px_5px_rgba(0,0,0,0.5)] z-10 border-b border-slate-600"></div> 
                                     <div className="w-[90%] h-16 bg-gradient-to-br from-emerald-600 to-emerald-800 rounded border border-emerald-900 transform rotate-1 flex justify-center items-center overflow-hidden shadow-[0_2px_4px_rgba(0,0,0,0.4)]">
                                         <span className="text-emerald-900 font-serif opacity-30 text-3xl font-bold">$</span>
                                     </div>
                                  </div>
                               ))}
                               <button onClick={() => setDrawerOpen(false)} className="absolute top-3 right-3 bg-black/80 text-white px-3 py-1.5 rounded text-xs font-bold hover:bg-black border border-slate-700 z-20 transition-colors shadow-md">
                                 Cerrar Cajón
                               </button>
                            </div>
                          </div>

                       </div>

                       {/* Evaluate Button placed sufficiently below to not hit drawer */}
                       {gameMode !== 'sandbox' && (
                          <div className="mt-48 z-30 relative">
                             <button 
                               onClick={evaluateTransaction}
                               className={`${gameMode === 'guided' ? 'bg-emerald-600 hover:bg-emerald-500 border-emerald-800' : 'bg-blue-600 hover:bg-blue-500 border-blue-800'} text-white px-6 py-4 rounded-xl shadow-lg border-b-4 active:border-b-0 active:translate-y-1 transition-all flex flex-col items-center justify-center min-w-[180px]`}
                             >
                                <i className="ph-bold ph-check-circle text-4xl mb-2"></i>
                                <span className="font-bold uppercase tracking-wider">Evaluar Acción</span>
                             </button>
                          </div>
                       )}

                    </div>
                  </div>
                </div>

              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
